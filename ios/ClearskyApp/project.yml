name: ClearskyApp
options:
  bundleIdPrefix: com.marcosmvm.clearsky
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ClearskyCore:
    path: ../ClearskyCore

targets:
  ClearskyApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ClearskyApp
    dependencies:
      - package: ClearskyCore
        product: ClearskyCore
    settings:
      base:
        PRODUCT_NAME: ClearskyApp
        PRODUCT_BUNDLE_IDENTIFIER: com.marcosmvm.clearsky.app
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Clearsky
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  ClearskyApp:
    build:
      targets:
        ClearskyApp: all
    run:
      config: Debug
    test:
      config: Debug
