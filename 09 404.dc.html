<script type="text/x-dc" data-dc-script data-props="{
  &quot;motion&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Scene&quot; }
}">
class Component extends DCLogic {
  componentDidMount() {
    this._raf = 0;
    this.onScroll = () => {
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => {
        this._raf = 0;
        const on = this.props.parallax ?? true;
        const vh = window.innerHeight;
        const y = window.scrollY || document.documentElement.scrollTop || 0;
        document.querySelectorAll('[data-depth]').forEach((el) => {
          if (!on) { el.style.transform = ''; return; }
          const d = parseFloat(el.dataset.depth) || 0;
          const r = el.getBoundingClientRect();
          el.style.transform = 'translate3d(0,' + (-((r.top + r.height / 2) - vh / 2) * d).toFixed(1) + 'px,0)';
        });
        const hero = document.querySelector('[data-hero-plate]');
        if (hero) {
          const p = Math.max(0, Math.min(1, y / Math.max(1, vh)));
          hero.style.transform = on ? 'translate3d(0,' + (y * 0.08).toFixed(1) + 'px,0) scale(' + (1 + p * 0.03).toFixed(3) + ')' : '';
        }
        const copy = document.querySelector('[data-hero-copy]');
        if (copy) {
          const p = Math.max(0, Math.min(1, y / (vh * 1.4)));
          copy.style.opacity = String(1 - p * 0.9);
          copy.style.transform = 'translate3d(0,' + (y * -0.06).toFixed(1) + 'px,0)';
        }
        
      });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onScroll);
    this.onScroll();
  }
  componentWillUnmount() { window.removeEventListener('scroll', this.onScroll); window.removeEventListener('resize', this.onScroll); if (this._raf) cancelAnimationFrame(this._raf); }
  renderVals() { return { rootClass: (this.props.motion ?? true) ? '' : 'ck-still' }; }
}
</script>
